<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Searcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-bottom: 1px solid #2a2a4a;
    }

    header h1 {
      font-size: 2rem;
      background: linear-gradient(90deg, #e040fb, #536dfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }

    header p { color: #888; font-size: 0.95rem; }

    .search-bar {
      display: flex;
      gap: 0.5rem;
      max-width: 600px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    .search-bar input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #333;
      border-radius: 8px;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus { border-color: #536dfe; }

    .search-bar button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #e040fb, #536dfe);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .search-bar button:hover { opacity: 0.85; }
    .search-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

    .filters {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      padding: 0 1rem;
      margin-bottom: 1rem;
    }

    .filters button {
      padding: 0.4rem 1rem;
      border: 1px solid #333;
      border-radius: 20px;
      background: transparent;
      color: #aaa;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filters button.active {
      border-color: #536dfe;
      color: #536dfe;
      background: rgba(83, 109, 254, 0.1);
    }

    .status {
      text-align: center;
      padding: 1rem;
      color: #888;
      font-size: 0.9rem;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem 2rem;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .card-top {
      display: flex;
      gap: 0.75rem;
      padding: 1rem;
    }

    .card-top img {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .card-info {
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }

    .card-info h3 {
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.2rem;
    }

    .card-info .artist {
      font-size: 0.85rem;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-info .album {
      font-size: 0.8rem;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 0.15rem;
    }

    .card-info .meta {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.4rem;
      font-size: 0.75rem;
      color: #666;
    }

    .card-player {
      padding: 0 1rem 1rem;
    }

    .card-player audio {
      width: 100%;
      height: 36px;
      border-radius: 8px;
    }

    .no-preview {
      padding: 0.5rem 1rem 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: #555;
    }

    .links {
      display: flex;
      gap: 0.5rem;
      padding: 0 1rem 1rem;
    }

    .links a {
      font-size: 0.8rem;
      color: #536dfe;
      text-decoration: none;
    }

    .links a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      .results { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Music Searcher</h1>
    <p>Search for songs, artists, and albums</p>
  </header>

  <div class="search-bar">
    <input type="text" id="query" placeholder="Search for music..." autofocus>
    <button id="searchBtn" onclick="search()">Search</button>
  </div>

  <div class="filters">
    <button class="active" data-entity="song">Songs</button>
    <button data-entity="album">Albums</button>
    <button data-entity="musicArtist">Artists</button>
    <button data-entity="musicVideo">Music Videos</button>
  </div>

  <div class="status" id="status"></div>
  <div class="results" id="results"></div>

  <script>
    const queryInput = document.getElementById('query');
    const searchBtn = document.getElementById('searchBtn');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    let currentEntity = 'song';

    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelector('.filters .active').classList.remove('active');
        btn.classList.add('active');
        currentEntity = btn.dataset.entity;
        if (queryInput.value.trim()) search();
      });
    });

    queryInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') search();
    });

    function formatDuration(ms) {
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    async function search() {
      const term = queryInput.value.trim();
      if (!term) return;

      searchBtn.disabled = true;
      statusEl.textContent = 'Searching...';
      resultsEl.innerHTML = '';

      try {
        const url = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=${currentEntity}&limit=30`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.resultCount === 0) {
          statusEl.textContent = 'No results found. Try a different search.';
          return;
        }

        statusEl.textContent = `Found ${data.resultCount} result${data.resultCount !== 1 ? 's' : ''}`;
        resultsEl.innerHTML = data.results.map(renderCard).join('');
      } catch (err) {
        statusEl.textContent = 'Search failed. Please try again.';
        console.error(err);
      } finally {
        searchBtn.disabled = false;
      }
    }

    function renderCard(item) {
      const img = (item.artworkUrl100 || item.artworkUrl60 || '').replace('100x100', '200x200');
      const name = item.trackName || item.collectionName || item.artistName || 'Unknown';
      const artist = item.artistName || '';
      const album = item.collectionName || '';
      const duration = item.trackTimeMillis ? formatDuration(item.trackTimeMillis) : '';
      const genre = item.primaryGenreName || '';
      const preview = item.previewUrl || '';
      const storeUrl = item.trackViewUrl || item.collectionViewUrl || item.artistLinkUrl || '';

      let playerHtml = '';
      if (preview) {
        playerHtml = `<div class="card-player"><audio controls preload="none" src="${preview}"></audio></div>`;
      } else {
        playerHtml = '<div class="no-preview">No preview available</div>';
      }

      return `
        <div class="card">
          <div class="card-top">
            ${img ? `<img src="${img}" alt="" loading="lazy">` : ''}
            <div class="card-info">
              <h3 title="${escHtml(name)}">${escHtml(name)}</h3>
              <div class="artist" title="${escHtml(artist)}">${escHtml(artist)}</div>
              ${album && album !== name ? `<div class="album" title="${escHtml(album)}">${escHtml(album)}</div>` : ''}
              <div class="meta">
                ${duration ? `<span>${duration}</span>` : ''}
                ${genre ? `<span>${genre}</span>` : ''}
              </div>
            </div>
          </div>
          ${playerHtml}
          ${storeUrl ? `<div class="links"><a href="${storeUrl}" target="_blank" rel="noopener">View on Apple Music</a></div>` : ''}
        </div>
      `;
    }

    function escHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }
  </script>
</body>
</html>
